<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DoConnect | User Register</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-auth-role="USER" data-auth-mode="register">
  <main class="auth-screen user-auth">
    <section class="auth-aside">
      <a class="back-link" href="index.html">DoConnect</a>
      <h1>Create User Account</h1>
      <p>Register as a learner and participate in active technical Q&A discussions.</p>
    </section>

    <section class="auth-card focused">
      <p class="eyebrow">User Registration</p>
      <h2>Join DoConnect</h2>
      <form id="authForm" class="form-stack">
        <label for="name">Full Name</label>
        <input id="name" type="text" autocomplete="name" placeholder="Your name" required />
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required />
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="new-password" placeholder="Minimum 6 characters" required minlength="6" />
        <button id="submitBtn" type="submit">Create User Account</button>
      </form>
      <p class="auth-switch">Already registered? <a href="user-login.html">Login as user</a></p>
      <div id="message" class="message" role="status"></div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
