<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DoConnect | Login</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="auth-page">
    <section class="hero">
      <h1>DoConnect</h1>
      <p>A microservice-based Question & Answer platform for technical discussions.</p>
      <div class="feature-grid">
        <span>Ask Questions</span>
        <span>Answer Threads</span>
        <span>Admin Approval</span>
        <span>Likes & Comments</span>
        <span>User Chat</span>
        <span>JWT Security</span>
      </div>
    </section>

    <section class="auth-card">
      <div class="tabs">
        <button class="tab active" data-target="user-login">User Login</button>
        <button class="tab" data-target="admin-login">Admin Login</button>
        <button class="tab" data-target="user-register">User Register</button>
        <button class="tab" data-target="admin-register">Admin Register</button>
      </div>

      <form id="user-login" class="auth-form active">
        <h2>User Login</h2>
        <input id="userLoginEmail" type="email" placeholder="Email" required />
        <input id="userLoginPassword" type="password" placeholder="Password" required />
        <button type="submit">Login as User</button>
      </form>

      <form id="admin-login" class="auth-form">
        <h2>Admin Login</h2>
        <input id="adminLoginEmail" type="email" placeholder="Email" required />
        <input id="adminLoginPassword" type="password" placeholder="Password" required />
        <button type="submit">Login as Admin</button>
      </form>

      <form id="user-register" class="auth-form">
        <h2>User Register</h2>
        <input id="userRegisterName" type="text" placeholder="Name" required />
        <input id="userRegisterEmail" type="email" placeholder="Email" required />
        <input id="userRegisterPassword" type="password" placeholder="Password" required />
        <button type="submit">Register User</button>
      </form>

      <form id="admin-register" class="auth-form">
        <h2>Admin Register</h2>
        <input id="adminRegisterName" type="text" placeholder="Name" required />
        <input id="adminRegisterEmail" type="email" placeholder="Email" required />
        <input id="adminRegisterPassword" type="password" placeholder="Password" required />
        <button type="submit">Register Admin</button>
      </form>

      <div id="message" class="message"></div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
